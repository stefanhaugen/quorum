[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quorum"
version = "0.2.0"
description = "Systems-engineered pipeline for migration risk assessment using WEF-nexus indicators."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Stefan Haugen", email = "stefanhaugen@gmail.com" }
]
keywords = [
    "humanitarian",
    "migration",
    "systems-engineering",
    "data-pipeline",
    "wef-nexus",
    "shap",
    "reliability",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "pandas>=2.1,<3.0",
    "numpy>=1.26,<3.0",
    "requests>=2.31,<3.0",
    "scikit-learn>=1.4,<2.0",
    "scipy>=1.11,<2.0",
    "statsmodels>=0.14,<1.0",
    "shap>=0.45,<1.0",
    "matplotlib>=3.8,<4.0",
    "seaborn>=0.13,<1.0",
    "openpyxl>=3.1,<4.0",
    "python-dotenv>=1.0,<2.0",
    "tenacity>=8.2,<10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "responses>=0.25",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-requests>=2.31",
]

[project.scripts]
quorum = "quorum.__main__:main"

[project.urls]
Homepage = "https://github.com/stefanhaugen/quorum"
Documentation = "https://github.com/stefanhaugen/quorum#readme"
Issues = "https://github.com/stefanhaugen/quorum/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["quorum*"]
exclude = ["tests*", "docs*", "outputs*"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["docs", "outputs", ".venv"]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle and pyflakes
    "I",                # isort
    "B",                # flake8-bugbear
    "UP",               # pyupgrade
    "RUF",              # ruff-specific
]
ignore = ["E501"]  # line length is enforced by formatter


[tool.ruff.lint.per-file-ignores]
# warnings filter must precede imports to silence sklearn/scipy import-time noise
"quorum/analytics_module.py" = ["E402"]
# REQUIRED_COLUMNS is an intentional class constant, not a dataclass field
"quorum/icd.py" = ["RUF012"]
# plt.subplots returns fig we intentionally discard for some figures
"quorum/design_module.py" = ["RUF059"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
strict_equality = true
exclude = ["docs/", "outputs/", "tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: requires network access to HDX HAPI",
]

[tool.coverage.run]
source = ["quorum"]
branch = true

[tool.coverage.report]
precision = 1
show_missing = true
skip_covered = false
